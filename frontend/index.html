<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframes — Trận Địa Số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7;
    --paper-2:#EFE7D2;
    --ink:#2A2520;
    --ink-soft:#5B5247;
    --line:#3a3027;
    --red:#B83227;
    --red-soft:#E8C6C0;
    --yellow:#F1C40F;
    --yellow-soft:#FAE9A1;
    --muted:#A89D8A;
    --grid:#D7CDB7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Be Vietnam Pro', system-ui, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, #fff8e7 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #f6ead0 0%, transparent 50%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity:.22;
    pointer-events:none;
    z-index:0;
  }
  #root{ position:relative; z-index:1; }

  .hand{ font-family:'Kalam', cursive; }
  .hand2{ font-family:'Patrick Hand', cursive; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* Header */
  header.top{
    padding: 28px 40px 0;
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:16px;
  }
  .title-block h1{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:42px;
    margin:0;
    letter-spacing:-.5px;
  }
  .title-block .sub{
    font-family:'Patrick Hand', cursive;
    color:var(--ink-soft);
    font-size:20px;
    margin-top:4px;
  }
  .stamp{
    display:inline-block;
    border:2px solid var(--red);
    color:var(--red);
    padding:8px 14px;
    transform:rotate(-3deg);
    font-family:'Kalam', cursive;
    font-weight:700;
    letter-spacing:1px;
    background:rgba(184,50,39,.05);
    box-shadow: 2px 2px 0 var(--red-soft);
  }
  .meta{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .meta b{ color:var(--ink); }

  /* Tabs */
  .tabs-wrap{
    padding: 24px 40px 0;
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, var(--paper) 70%, transparent);
    backdrop-filter: blur(4px);
  }
  .tabs{
    display:flex; gap:6px; flex-wrap:wrap;
    border-bottom:2px dashed var(--line);
    padding-bottom:0;
  }
  .tab{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:18px;
    padding:10px 18px 12px;
    background:transparent;
    border:2px solid transparent;
    border-bottom:none;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    transform: translateY(2px);
    transition: all .15s;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{
    background:var(--paper);
    border-color:var(--line);
    color:var(--ink);
    box-shadow: 0 -2px 0 var(--red) inset;
  }
  .tab .num{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-right:8px;
  }
  .tab.active .num{ color:var(--red); }

  /* Canvas area */
  .canvas{
    padding: 32px 40px 80px;
  }
  .screen-title{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    margin-bottom:24px;
  }
  .screen-title h2{
    font-family:'Kalam', cursive;
    font-size:32px; margin:0;
  }
  .screen-title .crumb{
    font-family:'JetBrains Mono', monospace;
    color:var(--muted); font-size:13px;
  }
  .screen-title .blurb{
    font-family:'Patrick Hand', cursive;
    font-size:18px;
    color:var(--ink-soft);
    max-width:640px;
  }

  /* Variations row */
  .row{
    display:flex; gap:36px; overflow-x:auto; padding:10px 4px 28px;
    scrollbar-color: var(--muted) transparent;
  }
  .row::-webkit-scrollbar{ height:10px; }
  .row::-webkit-scrollbar-thumb{ background:var(--muted); border-radius:4px; }

  .variant{
    flex: 0 0 auto;
    width: 300px;
    display:flex; flex-direction:column;
  }
  .variant .label{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:18px;
    margin-bottom:4px;
    display:flex; align-items:center; gap:8px;
  }
  .variant .label .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    background:var(--ink);
    color:var(--paper);
    padding:2px 6px;
    border-radius:3px;
    letter-spacing:.5px;
  }
  .variant .note{
    font-family:'Patrick Hand', cursive;
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:14px;
    min-height:42px;
    line-height:1.35;
  }

  /* Phone frame */
  .phone{
    width:300px;
    height:600px;
    background: #FBF6E9;
    border:2.5px solid var(--line);
    border-radius:32px;
    padding:10px 10px 14px;
    box-shadow:
      4px 4px 0 var(--ink),
      0 0 0 1px var(--line);
    position:relative;
    transform: rotate(var(--rot, -.5deg));
    transition: transform .2s;
  }
  .phone:hover{ transform: rotate(0deg) translateY(-4px); }
  .phone .notch{
    position:absolute;
    top:8px; left:50%;
    transform:translateX(-50%);
    width:80px; height:14px;
    background:var(--line);
    border-radius:0 0 10px 10px;
  }
  .phone .statusbar{
    display:flex; justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:9px; color:var(--ink-soft);
    padding: 4px 14px 6px;
    margin-top:8px;
  }
  .phone .screen{
    height: calc(100% - 32px);
    border-radius: 22px;
    background:#fff;
    overflow:hidden;
    display:flex; flex-direction:column;
    border:1.5px solid var(--line);
  }

  /* Density toggle inside phones */
  .compact .phone .screen { font-size: 13px; }
  .compact .stack { gap: 6px !important; padding: 8px !important; }
  .compact .card { padding: 8px !important; }

  /* Common sketchy UI */
  .sk-bar{
    height:6px; background:var(--ink); border-radius:3px;
  }
  .sk-line{
    height:6px; background:#d7cfc1; border-radius:3px;
  }
  .sk-line.short{ width:60%; }
  .sk-line.mid{ width:80%; }
  .sk-btn{
    border:2px solid var(--line);
    background:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:14px;
    text-align:center;
    cursor:pointer;
    box-shadow: 2px 2px 0 var(--line);
    transition: all .12s;
  }
  .sk-btn:hover{ transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--line); }
  .sk-btn.primary{
    background:var(--red); color:#fff;
    border-color:var(--red);
    box-shadow: 2px 2px 0 #6b1c14;
  }
  .sk-btn.warn{
    background:var(--yellow); color:var(--ink);
    border-color:var(--ink);
  }
  .sk-input{
    border:2px solid var(--line); border-radius:8px;
    padding:8px 10px; font-family:'Patrick Hand', cursive;
    font-size:15px;
    background:#fff;
    width:100%;
  }
  .card{
    border:2px solid var(--line);
    border-radius:10px;
    padding:10px;
    background:#fff;
    box-shadow: 2px 2px 0 var(--line);
  }
  .card.warn{ background:var(--yellow-soft); }
  .card.red{ background:var(--red); color:#fff; }
  .card.red .sk-line{ background: rgba(255,255,255,.5); }
  .pill{
    display:inline-block;
    border:1.5px solid var(--line);
    padding:2px 8px; border-radius:99px;
    font-family:'Patrick Hand', cursive; font-size:12px;
    background:#fff;
  }
  .pill.red{ background:var(--red); color:#fff; border-color:var(--red); }
  .pill.yellow{ background:var(--yellow); }

  .stack{ display:flex; flex-direction:column; gap:10px; padding:12px; }
  .row-stack{ display:flex; gap:8px; align-items:center; }

  .star{
    color:var(--red);
    font-family:'Kalam', cursive;
    font-weight:700;
  }

  /* Sketchy underline */
  .underline-sk{
    background-image: linear-gradient(transparent 80%, var(--yellow) 80%);
    padding: 0 2px;
  }

  /* Footer note row */
  .design-notes{
    margin-top: 18px;
    background: var(--paper-2);
    border:2px dashed var(--line);
    border-radius:12px;
    padding:18px 22px;
    font-family:'Patrick Hand', cursive;
    font-size:16px;
    color:var(--ink);
    line-height:1.5;
    max-width: 980px;
  }
  .design-notes b{ font-family:'Kalam', cursive; }
  .design-notes ul{ margin:6px 0 0; padding-left: 22px; }
  .design-notes li{ margin: 2px 0; }

  /* Density density buttons (visible always) */
  .controls{
    display:flex; gap:8px; align-items:center;
    font-family:'Patrick Hand', cursive;
  }
  .ctrl-btn{
    border:2px solid var(--line);
    background:#fff;
    padding:5px 12px;
    border-radius:6px;
    font-family:'Patrick Hand', cursive;
    font-size:14px;
    cursor:pointer;
  }
  .ctrl-btn.on{ background:var(--ink); color:var(--paper); }

  /* arrows scribble between phones (decorative) */
  .scribble{
    position:absolute;
    color:var(--muted);
    font-family:'Kalam', cursive;
  }
</style>
</head>
<body>
<div id="root"></div>
