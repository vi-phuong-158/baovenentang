<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype — Trận Địa Số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#B83227;
    --red-dark:#8B1A12;
    --red-soft:#FBEAE7;
    --yellow:#F4C20D;
    --yellow-soft:#FEF6D6;
    --bg:#F4EFE3;
    --surface:#FFFFFF;
    --surface-2:#FAF6EB;
    --ink:#1A1410;
    --ink-soft:#6B5F4F;
    --ink-mute:#A89D8A;
    --line:#E5DDC8;
    --line-soft:#EFE8D6;
    --ok:#1F8A5B;
    --ok-soft:#DBEFE4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #FBF5E5 0%, transparent 35%),
      radial-gradient(circle at 95% 100%, #F0E4C9 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  .display{ font-family:'Bricolage Grotesque', 'Be Vietnam Pro', sans-serif; letter-spacing:-.5px; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* Outer page */
  .page{
    padding: 40px 40px 80px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .page-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 24px; flex-wrap:wrap; margin-bottom: 36px;
  }
  .page-head h1{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:800; font-size: 44px; margin:0;
    letter-spacing:-1.2px; line-height:1;
  }
  .page-head h1 .accent{ color: var(--red); }
  .page-head .sub{
    color: var(--ink-soft); margin-top: 8px; font-size: 16px;
  }
  .page-head .meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; color: var(--ink-soft); line-height: 1.7;
    text-align: right;
  }
  .badge-row{
    display:flex; gap:8px; margin-top: 10px;
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding: 4px 10px; border-radius: 99px;
    font-size: 12px; font-weight: 500;
    background: var(--surface); border:1px solid var(--line);
    color: var(--ink-soft);
  }
  .pill.red{ background: var(--red); color:#fff; border-color: var(--red); }
  .pill.yellow{ background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
  .pill.ok{ background: var(--ok-soft); color: var(--ok); border-color: transparent; }

  /* Stage layout */
  .stage{
    display:grid;
    grid-template-columns: minmax(380px, 420px) 1fr;
    gap: 56px;
    align-items: flex-start;
  }
  @media (max-width: 1080px){
    .stage{ grid-template-columns: 1fr; }
  }

  .device-col{
    display:flex; flex-direction:column; align-items:center; gap: 20px;
    position: sticky; top: 24px;
  }
  .device-caption{
    text-align:center; color: var(--ink-soft); font-size: 13px;
    max-width: 280px;
  }
  .device-caption b{ color: var(--ink); }

  /* In-phone reset */
  .pa{ font-family:'Be Vietnam Pro', system-ui, sans-serif; }

  /* Reusable in-screen components */
  .screen-pad{ padding: 70px 18px 90px; }
  .screen-pad.with-tabbar{ padding-bottom: 110px; }

  .brand-strip{
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color: #fff;
    padding: 14px 18px 16px;
    border-radius: 20px;
    display:flex; align-items:center; gap: 12px;
    position: relative; overflow: hidden;
    box-shadow:
      0 10px 28px -8px rgba(184,50,39,.4),
      inset 0 1px 0 rgba(255,255,255,.2);
  }
  .brand-strip::after{
    content:""; position:absolute; right:-30px; top:-30px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, var(--yellow) 0%, transparent 70%);
    opacity:.32;
  }
  .brand-strip .mark{
    width: 38px; height: 38px; border-radius: 12px;
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .brand-strip .name{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: 16px; letter-spacing: -.2px; line-height: 1.1;
  }
  .brand-strip .tag{ font-size: 11px; opacity: .85; }

  /* Glass surfaces — frosted, "thicker" floating panels */
  .glass{
    background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.62));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow:
      0 20px 48px -12px rgba(26,20,16,.18),
      0 4px 16px rgba(26,20,16,.06),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -1px 0 rgba(26,20,16,.04);
  }
  .glass-dark{
    background: linear-gradient(180deg, rgba(26,20,16,.78), rgba(26,20,16,.65));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,.12);
    color:#fff;
    box-shadow:
      0 20px 48px -12px rgba(26,20,16,.45),
      inset 0 1px 0 rgba(255,255,255,.1);
  }
  .glass-red{
    background: linear-gradient(180deg, rgba(184,50,39,.92), rgba(139,26,18,.85));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.2);
    color:#fff;
    box-shadow:
      0 20px 48px -10px rgba(184,50,39,.4),
      inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* Tab bar — glass */
  .tabbar{
    position: absolute; left: 14px; right: 14px; bottom: 16px;
    border-radius: 24px;
    display: flex; padding: 7px;
    gap: 2px;
    background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.66));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow:
      0 18px 40px -10px rgba(26,20,16,.18),
      0 4px 14px rgba(26,20,16,.06),
      inset 0 1px 0 rgba(255,255,255,.9);
  }
  .tabbar .t{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding: 8px 0 6px;
    border-radius: 16px;
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .18s, color .18s, transform .12s;
  }
  .tabbar .t .ico{ display:flex; line-height: 1; }
  .tabbar .t.on{
    background: var(--ink);
    color: #fff;
    box-shadow: 0 4px 12px rgba(26,20,16,.2);
  }
  .tabbar .t:active{ transform: scale(.96); }

  /* Buttons */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding: 14px 16px;
    border-radius: 14px;
    font-weight: 600; font-size: 15px;
    cursor: pointer; border: none;
    transition: transform .1s, box-shadow .15s;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line);
    text-align: center;
    width: 100%;
  }
  .btn:active{ transform: scale(.98); }
  .btn.primary{
    background: var(--red); color: #fff; border-color: var(--red);
    box-shadow: 0 6px 16px rgba(184,50,39,.28);
  }
  .btn.yellow{
    background: var(--yellow); color: var(--ink); border-color: var(--yellow);
  }
  .btn.ghost{ background: transparent; border-color: var(--line); }
  .btn.sm{ padding: 10px 12px; font-size: 13px; }

  /* Card */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
  }
  .card.tinted{ background: var(--surface-2); }
  .card.red{ background: var(--red); color: #fff; border-color: var(--red); }
  .card.yellow{ background: var(--yellow-soft); border-color: var(--yellow); }

  /* Inputs */
  .field-label{
    font-size: 12px; color: var(--ink-soft); font-weight: 500;
    margin-bottom: 6px;
  }
  .field{
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    font: inherit; font-size: 14px; color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .field:focus{ border-color: var(--red); }

  /* Page transition */
  .page-fade{
    animation: fade .22s ease-out;
  }
  @keyframes fade{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* Desktop admin window */
  .desktop-wrap{
    display:flex; flex-direction:column; gap: 20px;
  }
  .win{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(26,20,16,.10);
  }
  .win-chrome{
    height: 38px; background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; padding: 0 14px; gap: 6px;
  }
  .win-chrome .dot{ width:12px; height: 12px; border-radius: 99px; }
  .win-chrome .url{
    flex:1; text-align:center; font-family:'JetBrains Mono', monospace;
    font-size: 12px; color: var(--ink-soft);
  }
  .win-body{ display: grid; grid-template-columns: 220px 1fr; min-height: 720px; }
  .win-side{
    background: var(--red); color: #fff;
    padding: 22px 16px;
  }
  .win-side .brand{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: 22px; margin-bottom: 4px;
  }
  .win-side .user{ font-size: 12px; opacity: .85; margin-bottom: 24px; }
  .win-side .nav-i{
    display:flex; align-items:center; gap: 10px;
    padding: 11px 12px;
    border-radius: 12px;
    font-size: 14px; font-weight: 500;
    margin-bottom: 2px;
    cursor: pointer;
    transition: background .15s;
  }
  .win-side .nav-i.on{ background: rgba(0,0,0,.18); }
  .win-side .nav-i:hover:not(.on){ background: rgba(255,255,255,.08); }
  .win-side .nav-i .ico{ width: 20px; text-align:center; }
  .win-body .main{
    padding: 28px 32px;
    background: var(--surface-2);
    overflow: hidden;
  }

  /* Section label */
  .section-label{
    text-transform: uppercase; letter-spacing: 1px;
    font-size: 11px; color: var(--ink-mute); font-weight: 600;
    margin-bottom: 8px;
  }

  /* Misc */
  .row{ display:flex; gap: 8px; align-items: center; }
  .row.tight{ gap: 4px; }
  .col{ display:flex; flex-direction: column; gap: 8px; }
  .grow{ flex: 1; }

  .strut{ height: 12px; }
  .strut-lg{ height: 24px; }

  .check{
    width: 22px; height: 22px; border-radius: 7px;
    border: 2px solid var(--line); flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    background: #fff;
    transition: all .15s;
  }
  .check.on{
    background: var(--red); border-color: var(--red);
    color: #fff;
  }

  /* hover affordance hint */
  .clickable{ cursor: pointer; transition: transform .1s; }
  .clickable:active{ transform: scale(.98); }

  /* Floating bottom CTA bar inside phone screens */
  .bottom-bar{
    position: absolute; left: 14px; right: 14px; bottom: 16px;
    border-radius: 22px;
    padding: 10px;
    display: flex; gap: 8px;
    background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.66));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow:
      0 18px 40px -10px rgba(26,20,16,.18),
      0 4px 14px rgba(26,20,16,.06),
      inset 0 1px 0 rgba(255,255,255,.9);
  }

  /* Icon chip — small rounded container around an icon */
  .icon-chip{
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    flex-shrink: 0;
  }
  .icon-chip.red{ background: var(--red-soft); color: var(--red); border-color: transparent; }
  .icon-chip.yellow{ background: var(--yellow-soft); color: #8B6914; border-color: transparent; }
  .icon-chip.ok{ background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .icon-chip.ink{ background: var(--ink); color: #fff; border-color: var(--ink); }
  .icon-chip.lg{ width: 48px; height: 48px; border-radius: 14px; }
  .icon-chip.xl{ width: 64px; height: 64px; border-radius: 18px; }

  /* Hero icon — used for category tiles, large feature icons */
  .hero-icon{
    width: 44px; height: 44px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.8);
  }
</style>
</head>
<body>

<div class="page">
  <header class="page-head">
    <div>
      <h1>Prototype — <span class="accent">Trận Địa Số</span></h1>
      <div class="sub">Mid-fi clickable · Home E · Signup B · Library B · Quiz D · Admin A</div>
      <div class="badge-row">
        <span class="pill red">v0.2 mid-fi</span>
        <span class="pill yellow">Mobile + Desktop admin</span>
        <span class="pill">Bấm vào các vùng để điều hướng</span>
      </div>
    </div>
    <div class="meta">
      <div>Vi Ngọc Phương · PA01 Phú Thọ</div>
      <div>13/05/2026 · iter 02</div>
    </div>
  </header>

  <div id="root" class="stage"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="prototype-screens.jsx"></script>
<script type="text/babel" src="prototype-admin.jsx"></script>
<script type="text/babel" src="prototype-app.jsx"></script>
</body>
</html>
