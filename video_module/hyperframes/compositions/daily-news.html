<!DOCTYPE html>
<!--
  Composition đầy đủ 8 scene — đọc dữ liệu từ ../data/scenes.json
  Render: cd hyperframes && npm run render
  Kết quả: ../output/video_raw.mp4 (1080x1920, 30fps)
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      background: #0a0a0a;
      font-family: 'Be Vietnam Pro', Arial, sans-serif;
      overflow: hidden;
    }

    /* ── Base clip layout ── */
    .clip {
      width: 1080px;
      height: 1920px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background gradients theo loại scene ── */
    .bg-intro    { background: linear-gradient(180deg, #0d0000 0%, #2d0808 60%, #0d0000 100%); }
    .bg-summary  { background: linear-gradient(180deg, #0a0a1a 0%, #001440 60%, #0a0a1a 100%); }
    .bg-news     { background: linear-gradient(180deg, #0d0000 0%, #1a0808 60%, #0d0000 100%); }
    .bg-briefs   { background: linear-gradient(180deg, #050510 0%, #0a0a30 60%, #050510 100%); }
    .bg-message  { background: linear-gradient(180deg, #0a0500 0%, #1a1000 60%, #0a0500 100%); }
    .bg-cta      { background: linear-gradient(180deg, #050505 0%, #101010 60%, #050505 100%); }

    /* ── Decorative bars ── */
    .bar-top, .bar-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 8px;
      background: linear-gradient(90deg, #cc0000, #ffcc00, #cc0000);
    }
    .bar-top    { top: 0; }
    .bar-bottom { bottom: 0; }

    /* ── Logo strip ── */
    .logo-strip {
      position: absolute;
      top: 60px;
      left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .logo-icon  { font-size: 64px; }
    .logo-text  { font-size: 36px; font-weight: 700; color: #ffffff; letter-spacing: 2px; }

    /* ── Content area ── */
    .content {
      width: 100%;
      padding: 0 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* ── Category badge ── */
    .badge {
      font-size: 32px;
      font-weight: 600;
      color: #ffcc00;
      text-transform: uppercase;
      letter-spacing: 4px;
      border-bottom: 2px solid #cc0000;
      padding-bottom: 8px;
    }

    /* ── Headline ── */
    .headline {
      font-size: 84px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.15;
    }

    /* ── Body text ── */
    .body-text {
      font-size: 54px;
      font-weight: 400;
      color: #e0e0e0;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Subtitle / voiceover caption (nửa dưới) ── */
    .subtitle-bar {
      position: absolute;
      bottom: 120px;
      left: 60px; right: 60px;
      text-align: center;
      font-size: 52px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.4;
      text-shadow: 0 0 8px #000, 2px 2px 6px #000, -2px -2px 6px #000;
    }

    /* ── CTA scene ── */
    .cta-url {
      font-size: 44px;
      color: #ffcc00;
      text-decoration: none;
      word-break: break-all;
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
  // Animation chung: fade-in + slide-up cho mỗi scene
  function buildTimeline(sceneId, headlineId, textId, subtitleId) {
    const tl = gsap.timeline({ paused: true });
    const scene = document.getElementById(sceneId);
    if (!scene) return tl;

    const headline = document.getElementById(headlineId);
    const text = document.getElementById(textId);
    const subtitle = document.getElementById(subtitleId);
    const logoStrip = scene.querySelector('.logo-strip');

    // Bắt đầu ở trạng thái ẩn
    gsap.set([logoStrip, headline, text, subtitle].filter(Boolean), { opacity: 0, y: 30 });

    tl.to(logoStrip, { opacity: 1, y: 0, duration: 0.5 }, 0.2);
    if (headline) tl.to(headline, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
    if (text)     tl.to(text,     { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    if (subtitle) tl.to(subtitle, { opacity: 1, y: 0, duration: 0.5 }, 1.1);

    return tl;
  }

  const mainTl = gsap.timeline({ paused: true });

  // Mỗi scene được xử lý trong buildTimeline riêng
  // 05_render_video.py sẽ inject dữ liệu từ scenes.json vào các element

  window.__timelines = {
    "troly35-daily": mainTl,
  };
</script>
