<!DOCTYPE html>
<!--
  Track B PoC: render 1 scene tĩnh để đo thời gian và RAM.
  Chạy: cd hyperframes && npm install && npm run poc
  Kết quả expected: output/poc_test.mp4 (9:16, 6 giây)
  Tiêu chí: thời gian render < 60s → HyperFrames khả thi cho Giai đoạn 3
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0a0a0a; font-family: 'Be Vietnam Pro', Arial, sans-serif; overflow: hidden; }

    .scene-intro {
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a0a0a 0%, #2d0808 50%, #1a0a0a 100%);
      position: relative;
    }

    .top-bar {
      position: absolute;
      top: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #cc0000, #ffcc00, #cc0000);
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #cc0000, #ffcc00, #cc0000);
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .logo-placeholder {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #cc0000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      opacity: 0;
    }

    .title {
      font-size: 72px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0;
    }

    .subtitle {
      font-size: 48px;
      font-weight: 400;
      color: #ffcc00;
      text-align: center;
      opacity: 0;
    }

    .date-badge {
      margin-top: 60px;
      padding: 20px 60px;
      border: 2px solid #cc0000;
      border-radius: 8px;
      font-size: 42px;
      color: #ffffff;
      opacity: 0;
    }
  </style>
</head>
<body>

<div
  id="root"
  data-composition-id="troly35-poc"
  data-start="0"
  data-width="1080"
  data-height="1920"
>
  <div class="clip" data-start="0" data-duration="6" data-track-index="0">
    <div class="scene-intro">
      <div class="top-bar"></div>

      <div class="logo-area">
        <div class="logo-placeholder" id="logo">🛡️</div>
        <div class="title" id="title">Trợ lý 35</div>
        <div class="subtitle" id="subtitle">Bảo vệ nền tảng tư tưởng</div>
        <div class="date-badge" id="date">Thứ Sáu, 22/5/2026</div>
      </div>

      <div class="bottom-bar"></div>
    </div>
  </div>
</div>

<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });

  tl.to("#logo",     { opacity: 1, scale: 1.1, duration: 0.8, ease: "back.out(1.2)" }, 0.3)
    .to("#logo",     { scale: 1.0, duration: 0.3 }, 1.1)
    .to("#title",    { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.8)
    .to("#subtitle", { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.3)
    .to("#date",     { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.8)
    .to({},          { duration: 0.001 }, 5.999); // hold đến đúng 6s

  window.__timelines = { "troly35-poc": tl };
</script>

</body>
</html>
